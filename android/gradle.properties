# File Purpose: Defines reproducible Gradle runtime defaults for the Cube Android build.
# Primary Components: JVM memory, AndroidX, Kotlin, and build-cache settings.
# Inputs/Outputs: Read by Gradle; affects local compilation without storing credentials.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
